<!doctype html>
<meta charset="utf-8">
<title>Kolnoa — essai web local</title>
<style>
 html,body{margin:0;background:#16181d;color:#e6e6e6;font:13px system-ui}
 #stage{position:relative;width:640px;height:360px;background:#000}
 video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;object-fit:contain}
 video.shown{width:640px;height:360px;opacity:1}
 canvas{display:block;background:#0d0f13}
 #msg{padding:6px}
</style>
<div id="stage"></div>
<canvas id="tl" width="1100" height="270"></canvas>
<div id="msg">Essai en cours : ne touche à rien et laisse cette fenêtre au premier plan.</div>
<script>
// Prototype d'essai : même scénario et mêmes gestes que bench_qt.py. Ne modifie rien ; envoie ses mesures au serveur local
// du harnais (127.0.0.1 uniquement). Les durées viennent de performance.now() ; les images de requestVideoFrameCallback.
const q = new URLSearchParams(location.search), variant = q.get('variant') || 'proxy', launch = parseFloat(q.get('launch')) || Date.now() / 1000;
const res = {toolkit: 'web', variant, metrics: {}, phases: [], errors: [], navigateur: navigator.userAgent};
const now = () => performance.now(), epoch = () => Date.now() / 1000, sleep = ms => new Promise(r => setTimeout(r, ms));
const to = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
const err = m => { res.errors.push(String(m)); console.error(m); };
function summarize(v) {
  v = v.filter(x => x != null && !isNaN(x)).sort((a, b) => a - b); if (!v.length) return null;
  const p = f => v[Math.min(v.length - 1, Math.floor(v.length * f))], r = x => Math.round(x * 100) / 100;
  return {n: v.length, mediane: r(p(.5)), p95: r(p(.95)), max: r(v[v.length - 1])};
}
function phase(name) { res.phases.push({name, t0: epoch(), t1: null}); }
function endPhase() { res.phases[res.phases.length - 1].t1 = epoch(); }

// prise en charge des codecs du navigateur (information utile en soi : HEVC/H.265 pour les rushes Sony)
const vt = document.createElement('video');
res.codecs_navigateur = {h264: vt.canPlayType('video/mp4; codecs="avc1.640028"'), hevc: vt.canPlayType('video/mp4; codecs="hvc1.1.6.L120.B0"'),
                         vp9: vt.canPlayType('video/webm; codecs="vp9"'), av1: vt.canPlayType('video/mp4; codecs="av01.0.08M.08"')};
let posted = false;
async function post() { if (posted) return; posted = true; try { await fetch('/web_' + variant, {method: 'POST', body: JSON.stringify(res)}); } catch (e) {} }
setTimeout(() => { err('délai global dépassé : résultats partiels'); post(); }, 360000);   // jamais d'attente infinie

(async () => {
  const sc = await (await fetch('/scenario.json')).json(), peaks = await (await fetch('/peaks.json')).json();
  const stage = document.getElementById('stage'), cv = document.getElementById('tl'), g = cv.getContext('2d');
  const TRACK_H = 26, COLORS = ['#3b6ea8', '#5a8f4a', '#a8623b', '#7b5aa8'];
  const tl = {zoom: .4, offset: 0, playhead: 0, drag: null};
  function draw() {
    g.fillStyle = '#0d0f13'; g.fillRect(0, 0, cv.width, cv.height);
    for (const k of sc.clips) {
      const x = (k.start - tl.offset) * tl.zoom, cw = k.dur * tl.zoom;
      if (x > cv.width || x + cw < 0) continue;
      const y = k.track * TRACK_H;
      g.fillStyle = COLORS[k.track % 4]; g.fillRect(x, y + 1, Math.max(1, cw - 1), TRACK_H - 2);
      if (sc.tracks[k.track].kind === 'audio' && cw > 8 && peaks.length) {
        const step = Math.max(1, Math.floor(1 / Math.max(tl.zoom, 1e-6) / (sc.fps * .02))), i0 = Math.floor((k.start / sc.fps) / .02) % Math.max(1, peaks.length - 1), mid = y + TRACK_H / 2;
        g.strokeStyle = 'rgba(255,255,255,.47)'; g.beginPath();
        for (let dx = 0; dx < Math.floor(cw); dx += 2) { const a = peaks[(i0 + dx * step) % peaks.length] / 255 * (TRACK_H / 2 - 2); g.moveTo(x + dx, mid - a); g.lineTo(x + dx, mid + a); }
        g.stroke();
      }
    }
    g.strokeStyle = '#ff5050'; g.lineWidth = 2; const px = (tl.playhead - tl.offset) * tl.zoom; g.beginPath(); g.moveTo(px, 0); g.lineTo(px, cv.height); g.stroke(); g.lineWidth = 1;
    if (tl.drag) { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(tl.drag.x, tl.drag.y, 90, TRACK_H - 2); }
  }

  // Canvas 2D enregistre les commandes et les exécute plus tard : on force la rastérisation (lecture d'un pixel) pour que le
  // temps mesuré soit comparable à QWidget.repaint(), qui peint de façon synchrone.
  const flush = () => g.getImageData(0, 0, 1, 1);
  // un <video> par angle ; un seul est « montré » (grand), les autres continuent d'être décodés
  const vids = {}; const frames = {}; let winFrames = 0, lastWinFrame = 0, shown = sc.angles[0].id;
  for (const a of sc.angles) {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = `/media/${variant}/${a.id}`;
    v.onerror = () => err(`${a.id}: ${v.error && v.error.message}`); stage.appendChild(v); vids[a.id] = v; frames[a.id] = 0;
    const cb = () => { frames[a.id]++; if (a.id === shown) { winFrames++; lastWinFrame = epoch(); } v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);
  }
  const setShown = id => { vids[shown].classList.remove('shown'); shown = id; vids[id].classList.add('shown'); };
  setShown(shown);
  const waitFrame = (ms = 3000) => new Promise(r => { const b = winFrames, t0 = now(); (function chk() { if (winFrames > b) r(now() - t0); else if (now() - t0 > ms) r(null); else setTimeout(chk, 1); })(); });
  const playAll = () => to(Promise.all(Object.values(vids).map(v => v.play().catch(e => err('play: ' + e.message)))), 5000);
  const seekAll = t => Object.values(vids).forEach(v => v.currentTime = t);
  const m = res.metrics;
  try {
    const loaded = await to(Promise.all(Object.values(vids).map(v => new Promise(r => v.readyState >= 2 ? r(1) : (v.addEventListener('loadeddata', () => r(1), {once: true}), v.addEventListener('error', () => r(0), {once: true}))))), 20000);
    if (!loaded || loaded.includes(0)) err('un ou plusieurs médias ne se chargent pas dans ce navigateur (codec ?)');
    phase('startup'); draw(); await playAll(); const w = await waitFrame(15000);
    m.startup_s = w == null ? null : Math.round((lastWinFrame - launch) * 100) / 100; if (w == null) err('aucune image affichée au démarrage'); endPhase();

    phase('decode_only'); for (const k in frames) frames[k] = 0; seekAll(0); await playAll(); await sleep(5000);
    m.decode_only = {angles: sc.angles.length, images_par_s_et_angle: Math.round(Object.values(frames).reduce((a, b) => a + b, 0) / 5 / sc.angles.length * 10) / 10}; endPhase();

    phase('ui_playback'); seekAll(0); await playAll(); winFrames = 0;
    const t0 = now(); let lat = [];
    const ph = setInterval(() => { tl.playhead = Math.floor((now() - t0) / 1000 * sc.fps); draw(); }, 33);
    for (const ev of sc.angle_events) {
      await sleep(Math.max(0, ev.t * 1000 - (now() - t0)));
      const target = sc.angles[Math.min(ev.key, sc.angles.length) - 1].id; if (target === shown) continue;
      const a = now(); setShown(target); const w2 = await waitFrame(2000); if (w2 != null) lat.push(now() - a);
    }
    await sleep(Math.max(0, sc.play_s * 1000 - (now() - t0))); clearInterval(ph);
    const el = (now() - t0) / 1000; m.ui_playback = {images_par_s: Math.round(winFrames / el * 10) / 10, duree_s: Math.round(el * 10) / 10};
    m.angle_switch_parallel_ms = summarize(lat); endPhase();

    phase('play_pause'); lat = []; const pv = () => vids[shown];
    for (let i = 0; i < sc.play_pause; i++) {
      let a = now(); const paused = new Promise(r => pv().addEventListener('pause', () => r(1), {once: true})); pv().pause(); if (await to(paused, 2000)) lat.push(now() - a);
      await sleep(100); a = now(); const b = winFrames; pv().play(); const w3 = await waitFrame(2000); if (w3 != null) lat.push(now() - a); await sleep(100);
    }
    m.play_pause_ms = summarize(lat); endPhase();

    phase('scrub'); pv().pause(); await sleep(200); lat = [];
    for (const pos of sc.scrubs) { const a = now(); pv().currentTime = pos; const w4 = await waitFrame(2000); if (w4 != null) lat.push(now() - a); }
    m.scrub_ms = summarize(lat); endPhase();

    phase('angle_switch_seek'); Object.values(vids).forEach(v => v.pause()); lat = [];
    const one = vids[sc.angles[0].id]; setShown(sc.angles[0].id);
    for (const ev of sc.angle_events.slice(0, 15)) {
      const cid = sc.angles[Math.min(ev.key, sc.angles.length) - 1].id, a = now();
      one.src = `/media/${variant}/${cid}`; one.currentTime = ev.t; one.play().catch(e => { if (e.name !== 'AbortError') err('play: ' + e.message); });
      const w5 = await waitFrame(4000); if (w5 != null) lat.push(now() - a);
    }
    one.pause(); m.angle_switch_seek_ms = summarize(lat); endPhase();

    phase('timeline_pan_zoom'); let times = [];
    for (let f = 0; f < sc.pan_zoom_frames; f++) { tl.zoom = .1 + (f % 60) / 40; tl.offset = f * 150; const a = now(); draw(); flush(); times.push(now() - a); await new Promise(r => requestAnimationFrame(r)); }
    m.timeline_pan_zoom_ms = summarize(times); endPhase();

    phase('drag_io'); times = [];
    for (const d of sc.drags) for (let s = 0; s < 20; s++) { tl.drag = {x: d.x0 + d.dx * s / 20, y: d.y0 + d.dy * s / 20}; const a = now(); draw(); flush(); times.push(now() - a); await new Promise(r => requestAnimationFrame(r)); }
    tl.drag = null; m.drag_io_ms = summarize(times); endPhase();
  } catch (e) { err(e && e.stack || e); }
  document.getElementById('msg').textContent = 'Terminé : envoi des mesures.';
  await post();
})();
</script>
