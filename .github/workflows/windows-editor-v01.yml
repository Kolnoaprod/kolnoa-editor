name: Kolnoa Editor V0.1.1 (EXE portable Windows)

# Fabrique KolnoaEditor.exe (éditeur complet) dans un zip, le vérifie par un autotest du parcours complet, puis le dépose en artefact du run.
# Ne fusionne rien, ne publie aucune release : le zip se télécharge depuis la page du run (onglet Actions → Artifacts).
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/v0.1-windows, feat/ui-pro]
    paths: ["src/**", "tests/**", "pyproject.toml", "tools/winapp/**", ".github/workflows/windows-editor-v01.yml", "docs/V0_1_1_WINDOWS.md"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        run: python -m pip install pyinstaller==6.22.3 PySide6==6.10.2 numpy psutil pytest scipy
      - name: ffmpeg (build statique gyan.dev, essentials)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/winapp/ffmpeg_bin | Out-Null
          $urls = @("https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
                    "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
          $ok = $false
          foreach ($u in $urls) {
            foreach ($try in 1..3) {
              try { Invoke-WebRequest $u -OutFile ff.zip; $ok = $true; break } catch { Write-Host "échec $u (essai $try) : $($_.Exception.Message.Split([char]10)[0])"; Start-Sleep 10 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "ffmpeg introuvable (toutes les sources ont échoué)" }
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item ffx/*/bin/ffmpeg.exe, ffx/*/bin/ffprobe.exe tools/winapp/ffmpeg_bin/
          & tools/winapp/ffmpeg_bin/ffmpeg.exe -hide_banner -filters | Select-String "vidstab|minterpolate|zscale"
      - name: Tests du parcours (Windows, Qt hors écran)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools\winapp\ffmpeg_bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pip install -e .
          python -m pytest -q
      - name: PyInstaller
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          # Le Qt des wheels utilise l'ICU de Windows. Ne pas collecter celle de Git/MSYS depuis le PATH.
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          & $python -m PyInstaller --noconfirm --onedir --windowed --name KolnoaEditor --paths src `
            --add-binary "tools\winapp\ffmpeg_bin\ffmpeg.exe;bin" --add-binary "tools\winapp\ffmpeg_bin\ffprobe.exe;bin" `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.Qt3DCore tools\winapp\kolnoa_editor_app.py
      - name: Autotest de l'EXE (import, montage, consigne, enregistrement, réouverture, export 1080p, aperçu)
        shell: pwsh
        run: |
          $env:KOLNOA_ENGINE_DIR = Join-Path $PWD "exe-autotest"
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $p = Start-Process dist/KolnoaEditor/KolnoaEditor.exe -WindowStyle Hidden -ArgumentList "--selftest" -PassThru -Wait
          Get-Content (Join-Path $env:KOLNOA_ENGINE_DIR startup.log)
          "code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "autotest de l'EXE échoué" }
      - name: Zip (EXE + mode d'emploi)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/KolnoaEditor pkg/ -Recurse
          Copy-Item docs/V0_1_1_WINDOWS.md pkg/KolnoaEditor/LISEZMOI.md
          Compress-Archive -Path pkg/KolnoaEditor -DestinationPath KolnoaEditor_V0.1.1.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KolnoaEditor_V0.1.2_interface
          path: KolnoaEditor_V0.1.1.zip
