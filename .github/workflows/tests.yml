name: Tests (suite complète)

# Lance la suite complète sur chaque pull request (brouillon compris) : le résultat sert de preuve de revue.
# Ne publie rien, ne fusionne rien.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg et bibliothèques système (rendu Qt hors écran)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Dépendances
        run: python -m pip install -e . pytest PySide6 numpy psutil
      - name: Suite complète
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=5 -p no:cacheprovider
