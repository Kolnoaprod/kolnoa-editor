name: Application d'essai Windows

# Fabrique KolnoaEditorTest.exe (lecteur multicam + timeline Qt + mesures 4K50/GPU) dans un zip. Ne fusionne rien, ne publie pas de release officielle :
# une PRÉ-version « windows-test-latest » sert de lien de téléchargement direct.
on:
  workflow_dispatch:
  push:
    branches: [feat/windows-test-build]
    paths: ["src/**", "tools/winapp/**", ".github/workflows/windows-test-app.yml", "docs/WINDOWS_TEST.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        run: python -m pip install pyinstaller PySide6 numpy psutil pytest
      - name: ffmpeg (build statique gyan.dev, essentials)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/winapp/ffmpeg_bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item ffx/*/bin/ffmpeg.exe, ffx/*/bin/ffprobe.exe tools/winapp/ffmpeg_bin/
      - name: Tests (lecteur, timeline, application d'essai)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools\winapp\ffmpeg_bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pip install -e .
          python -m pytest tests/test_multicam_player.py tests/test_ui_timeline.py tests/test_trim.py tests/test_razor_ui.py tests/test_bin_drag.py tests/test_peak_service.py tests/test_windows_test_app.py -q
      - name: PyInstaller
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name KolnoaEditorTest --paths src
          --add-binary "tools\winapp\ffmpeg_bin\ffmpeg.exe;bin" --add-binary "tools\winapp\ffmpeg_bin\ffprobe.exe;bin"
          --hidden-import kolnoa_editor.player.bench --hidden-import kolnoa_editor.player.suite
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.Qt3DCore tools\winapp\kolnoa_test_app.py
      - name: Vérification de l'EXE (démarre, ffmpeg embarqué, proxys, fenêtre, images reçues)
        shell: pwsh
        run: |
          $p = Start-Process dist/KolnoaEditorTest.exe -ArgumentList "--selftest" -PassThru -Wait
          "code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "autotest de l'EXE échoué" }
      - name: Zip (EXE + mode d'emploi)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/KolnoaEditorTest.exe pkg/
          Copy-Item docs/WINDOWS_TEST.md pkg/LISEZMOI.md
          Compress-Archive -Path pkg/* -DestinationPath KolnoaEditorTest.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KolnoaEditorTest
          path: KolnoaEditorTest.zip
          retention-days: 14
      - name: Pré-version « windows-test-latest » (lien direct, PAS une release officielle)
        if: github.ref == 'refs/heads/feat/windows-test-build'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete windows-test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-test-latest KolnoaEditorTest.zip --prerelease --target "$GITHUB_SHA" \
            --title "Kolnoa Editor — application d'essai Windows" --notes "Dézippe, double-clic sur KolnoaEditorTest.exe. Non signé : SmartScreen peut avertir. Branche feat/windows-test-build, rien n'est fusionné."
