name: Benchmark EXE (Windows)

# Fabrique KolnoaBenchmark.exe. Ne publie rien : le fichier est un « artefact » du run, téléchargeable par Claude/le réalisateur.
on:
  workflow_dispatch:
  push:
    branches: [feat/bench-gui]
    paths: ["tools/bench/**", ".github/workflows/bench-exe.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        run: python -m pip install pyinstaller PySide6 psutil numpy
      - name: ffmpeg (build statique gyan.dev, essentials)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/bench/exe/ffmpeg_bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item ffx/*/bin/ffmpeg.exe, ffx/*/bin/ffprobe.exe tools/bench/exe/ffmpeg_bin/
      - name: Test des outils d'essai
        run: |
          python -m pip install pytest
          python -m pytest tests/test_bench_tools.py tests/test_bench_gui.py -q
      - name: PyInstaller
        shell: cmd
        working-directory: tools/bench/exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name KolnoaBenchmark --paths ..
          --add-data "..\bench_web.html;." --add-binary "ffmpeg_bin\ffmpeg.exe;bin" --add-binary "ffmpeg_bin\ffprobe.exe;bin"
          --hidden-import bench_qt --hidden-import bench_run --hidden-import bench_common
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.Qt3DCore ..\bench_gui.py
      - name: Vérification au démarrage (le worker Qt répond)
        shell: pwsh
        run: |
          $p = Start-Process tools/bench/exe/dist/KolnoaBenchmark.exe -ArgumentList "--selftest" -PassThru -Wait
          "code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "autotest de l'EXE échoué" }
      - uses: actions/upload-artifact@v4
        with:
          name: KolnoaBenchmark
          path: tools/bench/exe/dist/KolnoaBenchmark.exe
          retention-days: 14
      - name: Pré-version « bench-latest » (lien de téléchargement direct, pas une release officielle)
        if: github.ref == 'refs/heads/feat/bench-gui'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete bench-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create bench-latest tools/bench/exe/dist/KolnoaBenchmark.exe --prerelease --target "$GITHUB_SHA" \
            --title "Kolnoa — Test de performance (EXE)" --notes "Double-clic sur KolnoaBenchmark.exe. Non signé : SmartScreen peut avertir. Ne rien fusionner : branche feat/bench-gui."
